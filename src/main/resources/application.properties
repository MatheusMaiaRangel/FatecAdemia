spring.application.name=FatecAdemia

# Permite rodar localmente lendo as variáveis de um arquivo .env na raiz do projeto.
# Variáveis de ambiente do sistema continuam tendo prioridade sobre o arquivo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.segredo=${JWT_SEGREDO}
jwt.expiracao=${JWT_EXPIRACAO}
jwt.emissor=${spring.application.name}

# Mensagens de validação sempre em português, independente do idioma do cliente.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
